name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: EliandroAgostinho
          outputs: |
            ./output/github-snake.svg
            ./output/github-snake-dark.svg
      - name: Push snake animation
        uses: actions/upload-artifact@v3
        with:
          name: snake
          path: ./output
